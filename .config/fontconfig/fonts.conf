<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match>
        <edit name="lang" mode="append">
            <string>zh-cn</string>
        </edit>
    </match>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrains Mono</family>
        </prefer>
    </alias>

    <match target="font">
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
    </match>

    <match target="font">
        <test name="family" ignore-blanks="true">
            <string>JetBrains Mono</string>
        </test>
        <edit name="fontfeatures" mode="append">
            <string>calt off</string>
            <string>zero on</string>
            <string>cv01 on</string>
            <string>cv07 on</string>
            <string>cv11 on</string>
            <string>cv12 on</string>
            <string>cv14 on</string>
            <string>cv19 on</string>
        </edit>
    </match>
</fontconfig>
