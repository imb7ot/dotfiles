<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match>
        <edit name="lang" mode="append">
            <string>zh-cn</string>
        </edit>
    </match>

    <alias binding="same">
        <family>IBM Plex Mono Var</family>
        <accept>
            <family>monospace</family>
        </accept>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>IBM Plex Mono Var</family>
        </prefer>
    </alias>

    <match target="font">
        <test name="family" ignore-blanks="true">
            <string>IBM Plex Mono Var</string>
        </test>
        <edit name="fontfeatures" mode="append">
            <string>zero on</string>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintfull</const>
        </edit>
    </match>
</fontconfig>
